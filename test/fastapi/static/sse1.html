<!DOCTYPE html>
<html>
<header>
    <title>前端页面SSE1</title>
    <meta charset="UTF-8">
</header>
<body>
<h3>场景1：基础的sse测试</h3>
<div id="result"></div>
<button onclick="b()"> 点我</button>
<button onclick="a()"> 点我</button>

<script>
    function b() {
        alert(1);
    }

    function a() {
        resultDom = document.getElementById("result");
        eventSource = new EventSource("http://localhost:8000/simple_stream");
        eventSource.onmessage = function (event) {
            if (event.data === "[END]") {
                eventSource.close();
                return;
            }
            resultDom.innerHTML += event.data + "<br>";
        }
    }
</script>
</body>
</html>
